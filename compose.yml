# Game Group Docker Compose Configuration
# This file defines the multi-container Docker application for the Game Group backend service.
# Services: PostgreSQL database, FastAPI backend, and Nginx frontend with HTTPS support.

services:
  # PostgreSQL database service for storing game library, user data, and game night logs
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped 
    environment:
      POSTGRES_DB: ${DB_NAME:-gamegroup}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "${EXTERNAL_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend service handling API endpoints for games, authentication, and game nights
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-gamegroup}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DB_PORT: ${DB_PORT:-5432}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      FORWARD_EMAIL_USER: ${FORWARD_EMAIL_USER}
      FORWARD_EMAIL_PASSWORD: ${FORWARD_EMAIL_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@gamegroup.com}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-00000000-0000-0000-0000-000000000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # FlareSolverr proxy used by the BGG scraper to solve Cloudflare challenges
      FLARESOLVERR_ENABLED: ${FLARESOLVERR_ENABLED:-true}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      FLARESOLVERR_TIMEOUT: ${FLARESOLVERR_TIMEOUT:-90}
      FLARESOLVERR_MAX_TIMEOUT: ${FLARESOLVERR_MAX_TIMEOUT:-60000}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} 

  # Nginx frontend service serving the web application with HTTPS support
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      HTTP_PORT: ${HTTP_PORT:-8082}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      CERT_PATH: ${CERT_PATH:-./certs}
    network_mode: "host"
    volumes:
      - ${CERT_PATH}:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started

  # FlareSolverr solves Cloudflare anti-bot challenges for the BGG scraper.
  # Internal only: reachable from the backend at http://flaresolverr:8191/v1 on the
  # Compose network. No host port is published, so dev and prod stacks never conflict.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      LOG_HTML: "false"
      CAPTCHA_SOLVER: "none"
      TZ: ${TZ:-UTC}

# Named volume for persistent PostgreSQL data storage
volumes:
  postgres_data:
